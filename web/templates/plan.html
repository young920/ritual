<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sport · 计划</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
<!-- Google Fonts:非阻塞加载。失败时 system 字体兜底。 -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="plan">

<header class="masthead">
  <a class="masthead__brand" href="/plan">sport</a>
  <nav class="masthead__nav">
    <a href="/plan" id="nav-plan">计划</a>
    <a href="/browse" id="nav-browse">浏览</a>
    <a href="/generate" id="nav-generate">生成</a>
    <a href="/settings" id="nav-settings">设置</a>
  </nav>
</header>

<!-- 空状态 -->
<section class="empty" id="empty" hidden>
  <div class="empty__inner">
    <div class="empty__eyebrow">还没有计划</div>
    <h2 class="empty__title">开始你的第一个训练计划</h2>
    <p class="empty__sub">告诉 AI 你想练什么、练几天,它会按天编排动作、组数和休息时间。</p>
    <a class="empty__cta" href="/generate">去生成 →</a>
  </div>
</section>

<!-- 当前计划 -->
<section class="plan-current" id="plan-current" hidden>
  <header class="hero">
    <div class="hero__date" id="hero-date">—</div>
    <h1 class="hero__title" id="hero-title"><em>—</em></h1>
    <div class="hero__meta" id="hero-meta">—</div>
    <p class="hero__summary" id="hero-summary">—</p>
  </header>

  <nav class="day-tabs" id="day-tabs"></nav>

  <section class="day-header" id="day-header">
    <p class="day-header__summary" id="day-summary"></p>
  </section>

  <main class="exercises" id="exercises"></main>

  <!-- 开始训练:一个按钮,不是大区块 -->
  <div class="start-training">
    <button class="start-training__btn" id="start-training-btn" type="button">
      开始训练 →
    </button>
  </div>

  <!-- 打卡区 -->
  <section class="check-in" id="check-in">
    <button class="check-in__btn" id="check-in-btn">完成</button>
    <div class="check-in__note-wrap">
      <input class="check-in__note" id="check-in-note" placeholder="(可选)加条笔记">
    </div>
    <div class="check-in__status" id="check-in-status"></div>
  </section>
</section>

<!-- 所有计划列表(active + archived) -->
<section class="plans-list" id="plans-list">
  <div class="plans-list__tabs">
    <button class="plans-list__tab is-active" data-filter="active">激活</button>
    <button class="plans-list__tab" data-filter="archived">归档</button>
    <button class="plans-list__tab" data-filter="all">全部</button>
  </div>
  <ul class="plans-list__items" id="plans-items">
    <li class="plans-list__empty">加载中…</li>
  </ul>
</section>

<div class="toast" id="toast"></div>

<!-- 沉浸式训练模式(默认隐藏) -->
<div class="train-overlay" id="training-overlay" hidden></div>

<script src="/static/i18n.js?v=57"></script>
<script src="/static/shared.js?v=57"></script>
<script src="/static/plan.js?v=57"></script>
<script src="/static/training.js?v=57"></script>
</body>
</html>
