<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sport · 生成</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
</head>
<body data-page="generate">

<header class="masthead">
  <a class="masthead__brand" href="/plan">sport</a>
  <nav class="masthead__nav">
    <a href="/plan" id="nav-plan">计划</a>
    <a href="/browse" id="nav-browse">浏览</a>
    <a href="/generate" id="nav-generate">生成</a>
    <a href="/settings" id="nav-settings">设置</a>
  </nav>
</header>

<section class="generate-form">
  <div class="generate-form__row">
    <label class="generate-form__label">意图</label>
    <input class="generate-form__input" id="intent-input"
           placeholder="例如:练胸,只有哑铃,初学者">
  </div>
  <div class="generate-form__row generate-form__row--filters">
    <div class="filter-group">
      <div class="filter-group__label">目标肌(可多选)</div>
      <div class="chip-row" id="target-chips">
        <span class="empty">加载中…</span>
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-group__label">器械(可多选)</div>
      <div class="chip-row" id="equipment-chips">
        <span class="empty">加载中…</span>
      </div>
    </div>
  </div>
  <div class="generate-form__row generate-form__row--meta">
    <label class="generate-form__label">天数</label>
    <input class="generate-form__input generate-form__input--tiny" id="days-input"
           type="number" min="1" max="7" value="1">
    <label class="generate-form__label">每天动作</label>
    <input class="generate-form__input generate-form__input--tiny" id="per-day-input"
           type="number" min="1" max="10" value="4">
    <button class="generate-form__btn" id="generate-btn">生成 →</button>
  </div>
</section>

<section class="generate-result" id="result" hidden>
  <header class="generate-result__header">
    <div>
      <div class="generate-result__eyebrow" id="result-eyebrow">—</div>
      <h1 class="generate-result__title" id="result-title">—</h1>
      <p class="generate-result__summary" id="result-summary"></p>
    </div>
    <div class="generate-result__actions">
      <button class="btn-secondary" id="save-btn">保存到我的计划</button>
      <button class="btn-secondary" id="reset-btn">重置</button>
    </div>
  </header>

  <nav class="day-tabs" id="result-day-tabs"></nav>
  <section class="day-header" id="result-day-header" hidden>
    <div class="day-header__num" id="result-day-num">第 — 天</div>
    <h2 class="day-header__title" id="result-day-title">—</h2>
    <p class="day-header__summary" id="result-day-summary"></p>
  </section>
  <main class="exercises" id="result-exercises"></main>
</section>

<section class="saved-plans" id="saved-plans-section">
  <h2 class="saved-plans__title">已保存的计划</h2>
  <ul class="saved-plans__list" id="saved-plans-list">
    <li class="empty">还没有保存的计划。</li>
  </ul>
</section>

<div class="toast" id="toast"></div>

<script src="/static/i18n.js?v=62"></script>
<script src="/static/shared.js?v=62"></script>
<script src="/static/generate.js?v=62"></script>
</body>
</html>
