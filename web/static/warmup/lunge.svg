<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" fill="#0A0807"/>
  <g stroke="#F5F2EE" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- 头 -->
    <circle cx="115" cy="48" r="16" fill="#F5F2EE"/>
    <!-- 躯干 -->
    <line x1="115" y1="64" x2="115" y2="120"/>
    <!-- 后腿伸直 -->
    <line x1="115" y1="120" x2="180" y2="160"/>
    <!-- 前腿弓步(膝弯曲) -->
    <line x1="115" y1="120" x2="65" y2="160"/>
    <!-- 脚/地面 -->
    <line x1="65" y1="160" x2="80" y2="160"/>
    <line x1="180" y1="160" x2="195" y2="160"/>
    <!-- 臂自然放两侧 -->
    <line x1="115" y1="80" x2="135" y2="135"/>
    <line x1="115" y1="80" x2="100" y2="135"/>
  </g>
  <!-- 拉伸箭头 -->
  <g fill="none" stroke="#C04A2C" stroke-width="4">
    <path d="M 140 145 A 30 20 0 1 1 90 145"/>
    <path d="M 90 145 L 98 138 L 100 150 Z" fill="#C04A2C" stroke="none"/>
  </g>
  <text x="115" y="195" text-anchor="middle" fill="#C04A2C" font-size="14" font-family="sans-serif">弓步拉伸</text>
</svg>
