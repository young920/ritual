<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" fill="#0A0807"/>
  <g stroke="#F5F2EE" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="110" cy="78" r="20" fill="#F5F2EE"/>
    <line x1="110" y1="98" x2="110" y2="170"/>
    <line x1="78" y1="110" x2="142" y2="110"/>
    <line x1="78" y1="110" x2="60" y2="170"/>
    <line x1="142" y1="110" x2="160" y2="170"/>
    <line x1="95" y1="170" x2="125" y2="170"/>
    <line x1="95" y1="170" x2="80" y2="210"/>
    <line x1="125" y1="170" x2="140" y2="210"/>
  </g>
  <!-- 肩绕前向箭头 -->
  <g fill="none" stroke="#C04A2C" stroke-width="4">
    <path d="M 70 95 A 30 18 0 0 1 150 95" stroke-dasharray="4 3">
      <animateTransform attributeName="transform" type="rotate"
        from="0 110 95" to="15 110 95" dur="1.5s" repeatCount="indefinite" values="0 110 95; 15 110 95; 0 110 95" keyTimes="0; 0.5; 1"/>
    </path>
  </g>
  <g fill="#C04A2C">
    <path d="M 150 95 L 142 88 L 142 102 Z">
      <animateTransform attributeName="transform" type="rotate"
        from="0 110 95" to="15 110 95" dur="1.5s" repeatCount="indefinite" values="0 110 95; 15 110 95; 0 110 95" keyTimes="0; 0.5; 1"/>
    </path>
  </g>
  <!-- 肩绕后向箭头 -->
  <g fill="none" stroke="#C04A2C" stroke-width="4">
    <path d="M 70 117 A 30 18 0 0 0 150 117" stroke-dasharray="4 3">
      <animateTransform attributeName="transform" type="rotate"
        from="0 110 117" to="-15 110 117" dur="1.5s" repeatCount="indefinite" values="0 110 117; -15 110 117; 0 110 117" keyTimes="0; 0.5; 1"/>
    </path>
  </g>
  <g fill="#C04A2C">
    <path d="M 70 117 L 78 110 L 78 124 Z">
      <animateTransform attributeName="transform" type="rotate"
        from="0 110 117" to="-15 110 117" dur="1.5s" repeatCount="indefinite" values="0 110 117; -15 110 117; 0 110 117" keyTimes="0; 0.5; 1"/>
    </path>
  </g>
  <text x="110" y="40" text-anchor="middle" fill="#C04A2C" font-size="14" font-family="sans-serif">肩绕环</text>
</svg>
