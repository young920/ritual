<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" fill="#0A0807"/>
  <!-- 墙 -->
  <g>
    <line x1="170" y1="20" x2="170" y2="210" stroke="#F5F2EE" stroke-width="6" stroke-linecap="round"/>
    <line x1="170" y1="40" x2="200" y2="20" stroke="#F5F2EE" stroke-width="2"/>
    <line x1="170" y1="80" x2="190" y2="60" stroke="#F5F2EE" stroke-width="2"/>
    <line x1="170" y1="130" x2="195" y2="115" stroke="#F5F2EE" stroke-width="2"/>
  </g>
  <g stroke="#F5F2EE" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="95" cy="100" r="14" fill="#F5F2EE"/>
    <line x1="95" y1="114" x2="120" y2="170"/>
    <line x1="100" y1="118" x2="155" y2="100"/>
    <line x1="105" y1="125" x2="155" y2="115"/>
    <line x1="120" y1="170" x2="118" y2="210"/>
  </g>
  <!-- 推墙动效:箭头往返位移 -->
  <g fill="#C04A2C">
    <path d="M 145 95 L 165 100 L 155 110 Z">
      <animate attributeName="opacity"
        values="0.3; 1; 0.3" dur="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -10 0; 0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="60" y="40" text-anchor="middle" fill="#C04A2C" font-size="14" font-family="sans-serif">推墙预热</text>
</svg>
