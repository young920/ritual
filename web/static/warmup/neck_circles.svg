<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" fill="#0A0807"/>
  <g stroke="#F5F2EE" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="110" cy="80" r="22" fill="#F5F2EE"/>
    <line x1="110" y1="102" x2="110" y2="160"/>
    <line x1="78" y1="108" x2="142" y2="108"/>
    <line x1="78" y1="108" x2="68" y2="160"/>
    <line x1="142" y1="108" x2="152" y2="160"/>
  </g>
  <!-- 绕头画圆+箭头转圈 -->
  <g fill="none" stroke="#C04A2C" stroke-width="4">
    <ellipse cx="110" cy="80" rx="40" ry="40" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate"
        from="0 110 80" to="360 110 80" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <!-- 箭头单独追随旋转 -->
  <g fill="#C04A2C">
    <path d="M 110 30 L 102 42 L 118 42 Z">
      <animateTransform attributeName="transform" type="rotate"
        from="0 110 80" to="360 110 80" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="110" y="200" text-anchor="middle" fill="#C04A2C" font-size="14" font-family="sans-serif">颈绕环</text>
</svg>
