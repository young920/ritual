<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" fill="#0A0807"/>
  <g stroke="#F5F2EE" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="110" cy="50" r="18" fill="#F5F2EE"/>
    <line x1="110" y1="68" x2="110" y2="98"/>
    <line x1="110" y1="98" x2="110" y2="170"/>
    <line x1="95" y1="170" x2="125" y2="170"/>
    <line x1="100" y1="170" x2="90" y2="210"/>
    <line x1="120" y1="170" x2="130" y2="210"/>
  </g>
  <!-- 双臂有节奏的开合 -->
  <g stroke="#F5F2EE" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="110" y1="108" x2="60" y2="100">
      <animateTransform attributeName="transform" type="rotate"
        from="0 110 108" to="-12 110 108" dur="2.5s" repeatCount="indefinite" values="0 110 108; -12 110 108; 0 110 108" keyTimes="0; 0.5; 1"/>
    </line>
    <line x1="110" y1="108" x2="160" y2="100">
      <animateTransform attributeName="transform" type="rotate"
        from="0 110 108" to="12 110 108" dur="2.5s" repeatCount="indefinite" values="0 110 108; 12 110 108; 0 110 108" keyTimes="0; 0.5; 1"/>
    </line>
  </g>
  <!-- 张开箭头双向 pulse -->
  <g fill="#C04A2C">
    <path d="M 32 80 L 48 75 L 48 85 Z"/>
    <path d="M 188 80 L 172 75 L 172 85 Z"/>
  </g>
  <text x="110" y="206" text-anchor="middle" fill="#C04A2C" font-size="14" font-family="sans-serif">扩胸激活</text>
</svg>
